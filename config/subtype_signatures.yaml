# Signatures for mapping ICC MINER states and programs (steps 07a/07b). Gene lists are never typed in here: they
# come from MSigDB GMT files or config/subtype_signatures_custom.tsv. The iCCA sets (SIA2013_, MARTINSERRANO2023_,
# JOB2020_, DONG2022_, CHAISAINGMONGKOL2017_, FAN2024_, SONG2022_, LIN2026_, ICC_PROGNOSTIC_) are written by
# scripts/tools/extract_icc_signatures.py from the supplements fetched by scripts/tools/fetch_signature_sources.py
# (registry config/signature_sources.yaml). Published per-sample calls: config/icc_published_labels.tsv.

msigdb:
  release: 2024.1.Hs
  base_url: https://data.broadinstitute.org/gsea-msigdb/msigdb/release/2024.1.Hs
  files:
    c2_cgp: data/reference/msigdb/c2.cgp.v2024.1.Hs.symbols.gmt
    hallmark: data/reference/msigdb/h.all.v2024.1.Hs.symbols.gmt

library_patterns:
  - "CHOLANGIO"
  - "LIVER_CANCER"
  - "HEPATOCELLULAR"
  - "^COULOUARN_TEMPORAL_TGFB1"
  - "PANCREATIC_CANCER"          # ductal adenocarcinoma programs (classical / basal-like biology is shared with large-duct iCCA)
include_hallmark: true

classifiers:
  andersen:                     # Andersen et al., Gastroenterology 2012;142:1021 (CCA prognostic classes; class 2 = poor)
    class1: {up: ["^ANDERSEN_CHOLANGIOCARCINOMA_CLASS1$"]}
    class2: {up: ["^ANDERSEN_CHOLANGIOCARCINOMA_CLASS2$"]}
  hoshida:                      # Hoshida et al. 2009 HCC classes; S1/S2-like and S3-like biology is also seen in iCCA
    S1: {up: ["^HOSHIDA_LIVER_CANCER_SUBCLASS_S1$"]}
    S2: {up: ["^HOSHIDA_LIVER_CANCER_SUBCLASS_S2$"]}
    S3: {up: ["^HOSHIDA_LIVER_CANCER_SUBCLASS_S3$"]}
  oishi:                        # Oishi et al., Hepatology 2012: stem-cell-like cholangiocarcinoma
    stem_like: {up: ["^OISHI_CHOLANGIOMA_STEM_CELL_LIKE_UP$"], dn: ["^OISHI_CHOLANGIOMA_STEM_CELL_LIKE_DN$"]}
    mature: {up: ["^OISHI_CHOLANGIOMA_STEM_CELL_LIKE_DN$"], dn: ["^OISHI_CHOLANGIOMA_STEM_CELL_LIKE_UP$"]}
  sia2013:                      # Sia et al., Gastroenterology 2013 (GSE32225): Proliferation (poor) / Inflammation classes
    Proliferation: {up: ["^custom:SIA2013_PROLIFERATION$"], dn: ["^custom:SIA2013_INFLAMMATION$"]}
    Inflammation: {up: ["^custom:SIA2013_INFLAMMATION$"], dn: ["^custom:SIA2013_PROLIFERATION$"]}
  stim:                         # Martin-Serrano et al., Gut 2023 STIM classes (top 100 genes per class, NTP as published);
                                # Beaufrere et al. assigned the same classes to GSE244807 and TCGA-CHOL
    IMMUNE_CLASSICAL: {up: ["^custom:MARTINSERRANO2023_IMMUNE_CLASSICAL$"]}
    INFLAMMATORY_STROMA: {up: ["^custom:MARTINSERRANO2023_INFLAMMATORY_STROMA$"]}
    HEPATIC_STEM_LIKE: {up: ["^custom:MARTINSERRANO2023_HEPATIC_STEM_LIKE$"]}
    TUMOUR_CLASSICAL: {up: ["^custom:MARTINSERRANO2023_TUMOUR_CLASSICAL$"]}
    DESERT_LIKE: {up: ["^custom:MARTINSERRANO2023_DESERT_LIKE$"]}
  dong2022:                     # Dong et al., Cancer Cell 2022 proteomic subgroups S1-S4 (FU-iCCA); mRNA templates derived
                                # from the published labels (extract_icc_signatures.py), so FU-iCCA calls are not independent
    S1: {up: ["^custom:DONG2022_S1_INFLAMMATION$"]}
    S2: {up: ["^custom:DONG2022_S2_INTERSTITIAL$"]}
    S3: {up: ["^custom:DONG2022_S3_METABOLISM$"]}
    S4: {up: ["^custom:DONG2022_S4_DIFFERENTIATION$"]}
  fan2024:                      # Fan et al., Nat Commun 2024: 30-gene NTP classifier of two pan-CCA subtypes (C1 poor)
    C1_mesenchymal: {up: ["^custom:FAN2024_C1_MESENCHYMAL$"], dn: ["^custom:FAN2024_C2_METABOLIC$"]}
    C2_metabolic: {up: ["^custom:FAN2024_C2_METABOLIC$"], dn: ["^custom:FAN2024_C1_MESENCHYMAL$"]}
  duct:                         # Song et al., Nat Commun 2022: large-duct (S100P+SPP1-) vs small-duct (S100P-SPP1+) tumour cells
    large_duct: {up: ["^custom:SONG2022_LARGE_DUCT$"], dn: ["^custom:SONG2022_SMALL_DUCT$"]}
    small_duct: {up: ["^custom:SONG2022_SMALL_DUCT$"], dn: ["^custom:SONG2022_LARGE_DUCT$"]}
  lin2026:                      # Lin et al., Cell Rep Med 2026: five subgroups from ITH-robust genes (NTP template, Table S5C)
    SI: {up: ["^custom:LIN2026_SI$"]}
    SII: {up: ["^custom:LIN2026_SII$"]}
    SIII-1: {up: ["^custom:LIN2026_SIII_1$"]}
    SIII-2: {up: ["^custom:LIN2026_SIII_2$"]}
    SIII-3: {up: ["^custom:LIN2026_SIII_3$"]}
  # Job 2020 immune subtypes (I1-I4) come from clustering 14 TME signature scores (JOB2020_* sets); no published
  # centroids, so no NTP classifier: compare with the published FU-iCCA calls (config/icc_published_labels.tsv).
  inflamed:                     # Montironi 2023 20-gene Inflamed signature (HCC-derived, generic T-cell inflammation)
    inflamed: {up: ["^custom:MONTIRONI2023_INFLAMED$"]}
    non_inflamed: {dn: ["^custom:MONTIRONI2023_INFLAMED$"]}

custom_file: config/subtype_signatures_custom.tsv
