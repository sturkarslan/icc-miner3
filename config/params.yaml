# ICC (intrahepatic cholangiocarcinoma) MINER pipeline parameters. Paths are relative to the project
# root (/proj/omics4tb2/sturkarslan/ICC). Same pipeline as the HCC project (hcc-miner3); sections are
# added here as each step is adapted to ICC.

paths:
  data: data
  results: results

# ---------------------------------------------------------------- step 01
cohorts:
  # Discovery = FU-iCCA only (Dong et al., Cancer Cell 2022; NODE OEP001105): 255 tumours with RNA-seq, 253 with WES
  # and copy number, OS for 251. Files are the paper's supplementary tables (mmc2 = Table S1, mmc3 = Table S2),
  # exported sheet by sheet to data/FU_iCCA/tables/. GSE244807, TCGA-CHOL and GSE107943 are validation cohorts
  # (step 08), not part of the network (decision 2026-10-01, PROJECT_LOG).
  FU_iCCA:
    expression: data/FU_iCCA/tables/mmc2_S1C_mRNA_expression.tsv   # log2(TPM + 1), gene symbols
    format: tsv_log2tpm
    skiprows: 1
    pseudocount: 1
    id_type: symbol
    sample_prefix: 'FU'              # numeric patient IDs -> FU111, ...

id_mapping:
  gencode_probemap: data/reference/gencode.v36.annotation.gtf.gene.probemap
  miner_idmap: /users/sturkars/mambaforge/envs/miner3/lib/python3.11/site-packages/miner/data/identifier_mappings.txt
  hgnc: data/reference/hgnc_complete_set.txt

harmonize:
  renormalize_tpm: true
  min_tpm: 1.0
  min_frac: 0.2
  protein_coding_only: false

# ---------------------------------------------------------------- step 02
batch:
  single_cohort_matrix: single     # one discovery cohort: gene z-score only -> expression_single_z.csv
  methods: [combat, cohort_z]
  combat_parametric: true
  z_clip_low: -4.0
  qc:
    n_pcs: 20
    programs:
      biliary: [KRT19, KRT7, SOX9, EPCAM, CFTR, SPP1, MUC1]
      proliferation: [MKI67, TOP2A, BIRC5, CCNB1, CDK1, BUB1, AURKA]
      hepatocyte: [ALB, APOA1, CYP3A4, CYP2E1, TTR, SERPINA1]
      stroma: [COL1A1, COL1A2, ACTA2, FAP, POSTN, DCN]

# ---------------------------------------------------------------- step 03 (survival, discovery cohort)
survival:
  horizon_months: 36               # same horizon as the HCC project; also written without a horizon
clinical:
  FU_iCCA:
    table: data/FU_iCCA/tables/mmc2_S1A_Clinical_info.tsv
    skiprows: 1
    id_column: Patient_ID
    os_days_column: 'OS, overall survival (day)'
    os_event_column: OS_event
    covariates: {sex: Sex, age: Age, stage: 'TNM stage', vascular_invasion: 'Vascular invasion',
                 lymph_node: 'Regional lymph Node metastasis', hbsag: 'HBsAg  (1, positive; 0, negative)',
                 liver_fluke: 'Liver fluke', adjuvant: 'Adjuvant therapies', ca19_9: 'CA19-9, carbohydrate antigen 19-9 (U/mL)'}

# ---------------------------------------------------------------- step 03b (genomic features for causal inference)
genomics:
  min_altered: 10          # altered samples among profiled (one cohort of ~253)
  min_freq: 0.03
  mutations: data/FU_iCCA/tables/mmc2_S1B_WES_mutations.tsv
  wes_flag_column: WES_seq           # clinical table: profiled by WES
  rna_flag_column: RNA_seq           # fusions are RNA-seq calls
  # snpEff terms counted as protein-altering (first term of Mutation_Type); synonymous and non-coding are dropped
  mutation_classes: [missense_variant, stop_gained, frameshift_variant, splice_acceptor_variant, splice_donor_variant,
                     disruptive_inframe_deletion, conservative_inframe_deletion, disruptive_inframe_insertion,
                     conservative_inframe_insertion, start_lost, stop_lost]
  # Curated iCCA drivers (Dong 2022; Jusakul 2017; Nakamura 2015; Farshidfar 2017; Zou 2014). Long-gene
  # passengers (TTN, MUC16, RYR2, ...) are deliberately not tested.
  driver_genes: [TP53, KRAS, NRAS, BRAF, IDH1, IDH2, BAP1, ARID1A, ARID2, PBRM1, SMAD4, TGFBR2, ACVR2A, FGFR2, EPHA2,
                 PIK3CA, PTEN, STK11, NF1, ATM, BRCA2, RNF43, ELF3, FBXW7, CDKN2A, RB1, KMT2C, KMT2D, SMARCA4, NCOR1,
                 ERBB2, ERBB3, MET, CTNNB1, AXIN1, APC, TERT, MYC, KEAP1, NFE2L2, TSC1, TSC2, ROBO2, PTPN3, GNAS]
  pathways:
    IDH: [IDH1, IDH2]
    RAS_MAPK: [KRAS, NRAS, BRAF, NF1]
    chromatin_remodeling: [ARID1A, ARID2, PBRM1, BAP1, KMT2C, KMT2D, SMARCA4]
    SWI_SNF: [ARID1A, ARID2, PBRM1, SMARCA4]
    TGFb: [SMAD4, TGFBR2, ACVR2A]
    p53_cell_cycle: [TP53, RB1, CDKN2A, ATM]
    PI3K_mTOR: [PIK3CA, PTEN, STK11, TSC1, TSC2]
    WNT: [RNF43, CTNNB1, AXIN1, APC]
  fusions: data/FU_iCCA/tables/mmc2_S1H_FGFR2_kinase_fusion.tsv
  fusion_genes: [FGFR2]              # feature FUS_<gene>: gene on either side
  # Copy number: gene-level log2 copy ratio (Table S2B); no segments are published.
  cna_gene: data/FU_iCCA/tables/mmc3_S2B_CNA_at_gene_level.tsv
  arm_threshold: 0.2       # arm gained / lost when the median gene log2 ratio on the arm is >= / <= this
  arm_min_genes: 50
  exclude_arms: [13p, 14p, 15p, 21p, 22p, Xp, Xq, Yp, Yq]
  focal_amp_threshold: 0.9           # GISTIC high-level thresholds used by the authors (Table S2A)
  focal_del_threshold: -1.3
  focal:
    CDKN2A: {type: hd, genes: [CDKN2A]}
    PTEN: {type: hd, genes: [PTEN]}
    MDM2: {type: amp, genes: [MDM2]}
    CCND1_FGF19: {type: amp, genes: [CCND1, FGF19]}
    MYC: {type: amp, genes: [MYC]}
    ERBB2: {type: amp, genes: [ERBB2]}
    MET: {type: amp, genes: [MET]}
    KRAS: {type: amp, genes: [KRAS]}
    EGFR: {type: amp, genes: [EGFR]}

# ---------------------------------------------------------------- step 04 (MINER3)
miner:
  matrix: single
  idmap: /users/sturkars/mambaforge/envs/miner3/lib/python3.11/site-packages/miner/data/identifier_mappings.txt
  tfs2genes: null
  min_genes: 6
  min_correlation: 0.2
  min_overexp_samples: 4
  max_exclusion: 0.5
  overexp_threshold: 80
  random_state: 12
  exclude_modules: []      # technical modules, set after step 04b module QC
  exclude_min_fraction: 0.5
