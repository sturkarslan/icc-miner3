# ICC (intrahepatic cholangiocarcinoma) MINER pipeline parameters. Paths are relative to the project
# root (/proj/omics4tb2/sturkarslan/ICC). Same pipeline as the HCC project (hcc-miner3); sections are
# added here as each step is adapted to ICC.

paths:
  data: data
  results: results

# ---------------------------------------------------------------- step 01
cohorts:
  # Discovery = FU-iCCA + TCGA-CHOL (intrahepatic) + GSE107943, 315 tumours (user decision 2026-10-02).
  # GSE244807 is held out for validation (step 08): strong within-cohort technical axis, and it is the only
  # large independent cohort with survival (PROJECT_LOG).
  FU_iCCA:
    # Dong et al., Cancer Cell 2022 (NODE OEP001105): paper supplementary tables exported to data/FU_iCCA/tables/
    expression: data/FU_iCCA/tables/mmc2_S1C_mRNA_expression.tsv   # log2(TPM + 1), gene symbols
    format: tsv_log2tpm
    skiprows: 1
    pseudocount: 1
    id_type: symbol
    sample_prefix: 'FU'              # numeric patient IDs -> FU111, ...
  TCGA:
    # UCSC Xena GDC hub; log2(TPM + 1), versioned Ensembl IDs (GENCODE v36)
    expression: data/TCGA_CHOL/TCGA-CHOL.star_tpm.tsv.gz
    format: xena_log2tpm
    pseudocount: 1
    id_type: ensembl
    sample_regex: '^TCGA-..-....-01A'
    exclude_list: config/tcga_exclude.tsv      # non-intrahepatic cases (GDC tissue_or_organ_of_origin)
  GSE107943:
    # Ahn et al. (PMID 30941318), 30 iCCA tumours (+ 27 adjacent liver, dropped); RPKM rescaled to TPM
    expression: data/GSE107943/suppl/GSE107943_RPKM.txt.gz
    format: rpkm_table
    id_column: Ensenble
    first_sample_column: s_081124004_001_RPKM
    header_row: 0
    id_type: ensembl
    sample_table: data/GSE107943/samples_geo.tsv
    sample_id_column: title
    sample_prefix: 'GSE107943_'
    keep_filters:
      'ch:tissue': ['Tumor (Intrahepatic cholangiocarcinoma)']
    label_columns: {author_class: 'ch:class', pathologic_type: 'ch:pathologic type'}

id_mapping:
  gencode_probemap: data/reference/gencode.v36.annotation.gtf.gene.probemap
  miner_idmap: /users/sturkars/mambaforge/envs/miner3/lib/python3.11/site-packages/miner/data/identifier_mappings.txt
  hgnc: data/reference/hgnc_complete_set.txt

harmonize:
  renormalize_tpm: true
  min_tpm: 1.0
  min_frac: 0.2
  protein_coding_only: false

# ---------------------------------------------------------------- step 02
batch:
  single_cohort_matrix: single     # one discovery cohort: gene z-score only -> expression_single_z.csv
  methods: [combat, cohort_z]
  combat_parametric: true
  z_clip_low: -4.0
  qc:
    n_pcs: 20
    programs:
      biliary: [KRT19, KRT7, SOX9, EPCAM, CFTR, SPP1, MUC1]
      proliferation: [MKI67, TOP2A, BIRC5, CCNB1, CDK1, BUB1, AURKA]
      hepatocyte: [ALB, APOA1, CYP3A4, CYP2E1, TTR, SERPINA1]
      stroma: [COL1A1, COL1A2, ACTA2, FAP, POSTN, DCN]

# ---------------------------------------------------------------- step 03 (survival, discovery cohort)
survival:
  horizon_months: 36               # same horizon as the HCC project; also written without a horizon
clinical:
  # id = sample_prefix + id_column (+ matched on the first id_match_chars characters of the network sample ID)
  FU_iCCA:
    table: data/FU_iCCA/tables/mmc2_S1A_Clinical_info.tsv
    skiprows: 1
    id_column: Patient_ID
    endpoints:
      OS: {time_column: 'OS, overall survival (day)', event_column: OS_event, time_to_days: 1}
    covariates: {sex: Sex, age: Age, stage: 'TNM stage', vascular_invasion: 'Vascular invasion',
                 lymph_node: 'Regional lymph Node metastasis', hbsag: 'HBsAg  (1, positive; 0, negative)',
                 liver_fluke: 'Liver fluke', adjuvant: 'Adjuvant therapies', ca19_9: 'CA19-9, carbohydrate antigen 19-9 (U/mL)'}
  TCGA:
    table: data/TCGA_CHOL/gdc_cases.tsv        # GDC API case table from the fetch script
    id_column: patient
    id_match_chars: 12
    endpoints:
      OS: {time_column: os_days, event_column: os_event, time_to_days: 1}
    covariates: {age: demographic.age_at_index, stage: diagnoses.ajcc_pathologic_stage}
  GSE107943:
    table: data/GSE107943/samples_geo.tsv
    id_column: title
    endpoints:
      OS: {time_column: 'ch:survival(mo)', event_column: 'ch:death', time_to_days: 30.44}
      RFS: {time_column: 'ch:dsfree(mo)', event_column: 'ch:recurr', time_to_days: 30.44}
    covariates: {sex: 'ch:Sex', age: 'ch:age', stage: 'ch:stageajcc', vascular_invasion: 'ch:vas_inv',
                 hbsag: 'ch:hepatitis b', ca19_9: 'ch:ca19-9'}

# ---------------------------------------------------------------- step 03b (genomic features for causal inference)
genomics:
  min_altered: 10          # altered samples among profiled (FU-iCCA ~249 + TCGA 30 for mutations)
  TCGA:
    maf: data/TCGA_CHOL/TCGA-CHOL.somaticmutation_wxs.tsv.gz    # Xena: sample, gene, effect (VEP terms)
  min_freq: 0.03
  mutations: data/FU_iCCA/tables/mmc2_S1B_WES_mutations.tsv
  wes_flag_column: WES_seq           # clinical table: profiled by WES
  rna_flag_column: RNA_seq           # fusions are RNA-seq calls
  # snpEff terms counted as protein-altering (first term of Mutation_Type); synonymous and non-coding are dropped
  mutation_classes: [missense_variant, stop_gained, frameshift_variant, splice_acceptor_variant, splice_donor_variant,
                     disruptive_inframe_deletion, conservative_inframe_deletion, disruptive_inframe_insertion,
                     conservative_inframe_insertion, start_lost, stop_lost]
  # Curated iCCA drivers (Dong 2022; Jusakul 2017; Nakamura 2015; Farshidfar 2017; Zou 2014). Long-gene
  # passengers (TTN, MUC16, RYR2, ...) are deliberately not tested.
  driver_genes: [TP53, KRAS, NRAS, BRAF, IDH1, IDH2, BAP1, ARID1A, ARID2, PBRM1, SMAD4, TGFBR2, ACVR2A, FGFR2, EPHA2,
                 PIK3CA, PTEN, STK11, NF1, ATM, BRCA2, RNF43, ELF3, FBXW7, CDKN2A, RB1, KMT2C, KMT2D, SMARCA4, NCOR1,
                 ERBB2, ERBB3, MET, CTNNB1, AXIN1, APC, TERT, MYC, KEAP1, NFE2L2, TSC1, TSC2, ROBO2, PTPN3, GNAS]
  pathways:
    IDH: [IDH1, IDH2]
    RAS_MAPK: [KRAS, NRAS, BRAF, NF1]
    chromatin_remodeling: [ARID1A, ARID2, PBRM1, BAP1, KMT2C, KMT2D, SMARCA4]
    SWI_SNF: [ARID1A, ARID2, PBRM1, SMARCA4]
    TGFb: [SMAD4, TGFBR2, ACVR2A]
    p53_cell_cycle: [TP53, RB1, CDKN2A, ATM]
    PI3K_mTOR: [PIK3CA, PTEN, STK11, TSC1, TSC2]
    WNT: [RNF43, CTNNB1, AXIN1, APC]
  fusions: data/FU_iCCA/tables/mmc2_S1H_FGFR2_kinase_fusion.tsv
  fusion_genes: [FGFR2]              # feature FUS_<gene>: gene on either side
  # Copy number: gene-level log2 copy ratio (Table S2B); no segments are published.
  cna_gene: data/FU_iCCA/tables/mmc3_S2B_CNA_at_gene_level.tsv
  arm_threshold: 0.2       # arm gained / lost when the median gene log2 ratio on the arm is >= / <= this
  arm_min_genes: 50
  # Acrocentric p arms and sex chromosomes, plus GC-rich arms whose exome-derived ratios move together across
  # samples (mean r >= 0.45 with 17q / 19p / 19q / 22q; gains AND losses in 20-45%): judged a GC-wave artefact.
  exclude_arms: [13p, 14p, 15p, 21p, 22p, Xp, Xq, Yp, Yq, 16p, 17p, 17q, 19p, 19q, 22q, 11q]
  focal_amp_threshold: 0.9           # GISTIC high-level thresholds used by the authors (Table S2A)
  focal_del_threshold: -1.3
  focal:
    CDKN2A: {type: hd, genes: [CDKN2A]}
    PTEN: {type: hd, genes: [PTEN]}
    MDM2: {type: amp, genes: [MDM2]}
    CCND1_FGF19: {type: amp, genes: [CCND1, FGF19]}
    MYC: {type: amp, genes: [MYC]}
    ERBB2: {type: amp, genes: [ERBB2]}
    MET: {type: amp, genes: [MET]}
    KRAS: {type: amp, genes: [KRAS]}
    EGFR: {type: amp, genes: [EGFR]}

# ---------------------------------------------------------------- step 04 (MINER3)
miner:
  matrix: combat           # 315-tumour network. The FU-iCCA-only run (matrix "single", 255) is kept as a sensitivity run
  idmap: /users/sturkars/mambaforge/envs/miner3/lib/python3.11/site-packages/miner/data/identifier_mappings.txt
  tfs2genes: null
  min_genes: 6
  min_correlation: 0.2
  min_overexp_samples: 4
  max_exclusion: 0.5
  overexp_threshold: 80
  random_state: 12
  # Technical modules (step 04b_technical_modules.py): modules that follow the anchor module in the reference cohort
  # and have no marker biology. Module IDs are from THIS run (random_state 12); re-derive if MINER is rerun.
  technical: {anchor_module: 0, reference_cohort: FU_iCCA, min_r_anchor: 0.7, max_marker_r: 0.5}
  exclude_modules: [0, 13, 20, 23, 24, 25, 29, 37, 44, 45, 63, 66, 67, 76, 111, 112, 114, 125, 140, 148, 152, 162, 177, 186, 191, 195, 196, 222, 225, 228, 250, 251, 270, 282, 304, 309, 327, 329, 356, 361, 366, 368, 380, 389, 390, 402, 427, 433, 436, 440, 474, 476, 494, 496, 502, 512, 523, 529, 536, 540, 547, 548, 551, 564, 570, 574, 592, 598, 605, 615, 626, 635, 645, 681, 682, 690, 694, 695, 700, 705, 715, 716, 717, 721, 730, 737, 743, 746, 765, 766, 782, 791, 867, 876, 878]
  exclude_min_fraction: 0.5

# ---------------------------------------------------------------- step 05 (causal inference)
causal:
  alpha: 0.05
  q_max: 0.1
  min_cohort_altered: 5    # a cohort is tested when it has >= this many altered and wild-type samples
  # Genomics is essentially one cohort (FU-iCCA; TCGA adds a few mutations), so one tested cohort is enough;
  # when TCGA is testable for a feature it must agree in direction. Stability is checked separately (split-half).
  min_cohorts: 1
  family_r: 0.9
  min_abs_d: 0.5
  min_altered_hc: 25       # HCC used 30 with 929 tumours; 25 keeps the FGFR2 fusion (28)
  gene_positions: data/reference/gencode.v36.annotation.gtf.gene.probemap
  cytoband: data/reference/cytoBand_hg38.txt.gz

# ---------------------------------------------------------------- step 06 (risk)
risk:
  subtypes_dir: subtypes_filtered
  survival_cohorts: [FU_iCCA, TCGA, GSE107943]
  endpoints: [OS]                     # OS is the only endpoint in FU-iCCA and TCGA (GSE107943 also has RFS)
  survival_suffix: _h36m              # 36-month horizon, as in HCC (never pool survival across cohorts)
  q_max: 0.1
  method: xgboost
  n_estimators: 100
  iterations: 20
  class1_proportion: 0.2
  test_proportion: 0.35
  train_test:                         # only FU-iCCA is large enough to train; the two small cohorts are in-network tests.
    - {train: FU_iCCA, endpoint: OS, test: [TCGA, GSE107943]}     # GSE244807 is the external test (step 08)
  ridge:
    features: [programs, regulons]
    train_cut_low: 0.5
    n_iter: 250
    max_alpha: 5000
    alpha_step: 100
    seed: 12

# ---------------------------------------------------------------- step 08 (external validation)
validation:
  horizon_days: 1096                 # 36 months, as in discovery
  top_fraction: 0.2
  min_regulon_coverage: 0.5
  models: [FU_iCCA_OS_h36m]          # step-06 ridge program model (weights never refit)
  cohorts:
    GSE244807:                       # Beaufrere et al. 2024; 246 iCCA, 137 biopsies + 109 surgical specimens, OS
      loader: tpm_geo
      expression: data/GSE244807/suppl/GSE244807_kallistoGeneAbund_geo.tsv.gz
      sample_table: data/GSE244807/samples_geo.tsv
      sample_id_column: 'ch:sample id'
      survival:
        OS: {time_column: 'ch:os', event_column: 'ch:death', time_to_days: 30.44}
      strata_column: 'ch:tissue'     # biopsy vs surgical: technical and clinical confounder, always reported separately
      tech_covariate: true           # also adjust for genes detected per sample
      covariates: {sex: 'ch:gender', age: 'ch:age at_the_time_of_sampling'}
      endpoints: [OS]

# ---------------------------------------------------------------- step 07 (subtype / signature mapping)
post:
  signatures_config: config/subtype_signatures.yaml
  subtypes_dir: subtypes_filtered
  min_set_genes: 5
  ntp:
    permutations: 1000
    fdr: 0.05
    seed: 1
    center: all
