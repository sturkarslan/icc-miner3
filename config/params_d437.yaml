# Design d437: derived from config/params.yaml by adding GSE179443 and OEP002768 (unique patients) to discovery. Results in results_d437/.
# Generated 2026-10-02; edit here for this design (comments of the main file are not carried over).
paths:
  data: data
  results: results_d437
cohorts:
  FU_iCCA:
    expression: data/FU_iCCA/tables/mmc2_S1C_mRNA_expression.tsv
    format: tsv_log2tpm
    skiprows: 1
    pseudocount: 1
    id_type: symbol
    sample_prefix: FU
  TCGA:
    expression: data/TCGA_CHOL/TCGA-CHOL.star_tpm.tsv.gz
    format: xena_log2tpm
    pseudocount: 1
    id_type: ensembl
    sample_regex: ^TCGA-..-....-01A
    exclude_list: config/tcga_exclude.tsv
  GSE107943:
    expression: data/GSE107943/suppl/GSE107943_RPKM.txt.gz
    format: rpkm_table
    id_column: Ensenble
    first_sample_column: s_081124004_001_RPKM
    header_row: 0
    id_type: ensembl
    sample_table: data/GSE107943/samples_geo.tsv
    sample_id_column: title
    sample_prefix: GSE107943_
    keep_filters:
      ch:tissue:
      - Tumor (Intrahepatic cholangiocarcinoma)
    label_columns:
      author_class: ch:class
      pathologic_type: ch:pathologic type
  GSE179443:
    expression: data/GSE179443/suppl/GSE179443_Raw_gene_counts.txt.gz
    format: fpkm_table
    sep_regex: \s+
    log2_pseudocount: 1
    id_type: ensembl
    sample_table: data/GSE179443/samples_geo.tsv
    sample_id_column: title
    keep_filters:
      ch:disease state:
      - ICC
    label_columns:
      lc_subtype: ch:molecular subtype
  OEP002768:
    expression: data/OEP002768/tables/expression_fpkm_icca.tsv
    format: fpkm_table
    id_type: symbol
    sample_table: data/OEP002768/tables/samples_icca.tsv
    sample_id_column: sample
    keep_filters:
      overlap_fu:
      - 'False'
    min_filters:
      n_genes_detected: 9000
    label_columns:
      duct_type: duct_type
id_mapping:
  gencode_probemap: data/reference/gencode.v36.annotation.gtf.gene.probemap
  miner_idmap: /users/sturkars/mambaforge/envs/miner3/lib/python3.11/site-packages/miner/data/identifier_mappings.txt
  hgnc: data/reference/hgnc_complete_set.txt
harmonize:
  renormalize_tpm: true
  min_tpm: 1.0
  min_frac: 0.2
  protein_coding_only: false
batch:
  single_cohort_matrix: single
  methods:
  - combat
  - cohort_z
  combat_parametric: true
  z_clip_low: -4.0
  qc:
    n_pcs: 20
    programs:
      biliary:
      - KRT19
      - KRT7
      - SOX9
      - EPCAM
      - CFTR
      - SPP1
      - MUC1
      proliferation:
      - MKI67
      - TOP2A
      - BIRC5
      - CCNB1
      - CDK1
      - BUB1
      - AURKA
      hepatocyte:
      - ALB
      - APOA1
      - CYP3A4
      - CYP2E1
      - TTR
      - SERPINA1
      stroma:
      - COL1A1
      - COL1A2
      - ACTA2
      - FAP
      - POSTN
      - DCN
survival:
  horizon_months: 36
clinical:
  FU_iCCA:
    table: data/FU_iCCA/tables/mmc2_S1A_Clinical_info.tsv
    skiprows: 1
    id_column: Patient_ID
    endpoints:
      OS:
        time_column: OS, overall survival (day)
        event_column: OS_event
        time_to_days: 1
    covariates:
      sex: Sex
      age: Age
      stage: TNM stage
      vascular_invasion: Vascular invasion
      lymph_node: Regional lymph Node metastasis
      hbsag: HBsAg  (1, positive; 0, negative)
      liver_fluke: Liver fluke
      adjuvant: Adjuvant therapies
      ca19_9: CA19-9, carbohydrate antigen 19-9 (U/mL)
  TCGA:
    table: data/TCGA_CHOL/gdc_cases.tsv
    id_column: patient
    id_match_chars: 12
    endpoints:
      OS:
        time_column: os_days
        event_column: os_event
        time_to_days: 1
    covariates:
      age: demographic.age_at_index
      stage: diagnoses.ajcc_pathologic_stage
  GSE107943:
    table: data/GSE107943/samples_geo.tsv
    id_column: title
    endpoints:
      OS:
        time_column: ch:survival(mo)
        event_column: ch:death
        time_to_days: 30.44
      RFS:
        time_column: ch:dsfree(mo)
        event_column: ch:recurr
        time_to_days: 30.44
    covariates:
      sex: ch:Sex
      age: ch:age
      stage: ch:stageajcc
      vascular_invasion: ch:vas_inv
      hbsag: ch:hepatitis b
      ca19_9: ch:ca19-9
  OEP002768:
    table: data/OEP002768/tables/samples_icca.tsv
    id_column: sample
    endpoints:
      OS:
        time_column: os_days
        event_column: os_event
        time_to_days: 1
    covariates:
      sex: sex
      age: age
      stage: stage
      duct_type: duct_type
genomics:
  min_altered: 10
  TCGA:
    maf: data/TCGA_CHOL/TCGA-CHOL.somaticmutation_wxs.tsv.gz
  min_freq: 0.03
  mutations: data/FU_iCCA/tables/mmc2_S1B_WES_mutations.tsv
  wes_flag_column: WES_seq
  rna_flag_column: RNA_seq
  mutation_classes:
  - missense_variant
  - stop_gained
  - frameshift_variant
  - splice_acceptor_variant
  - splice_donor_variant
  - disruptive_inframe_deletion
  - conservative_inframe_deletion
  - disruptive_inframe_insertion
  - conservative_inframe_insertion
  - start_lost
  - stop_lost
  driver_genes:
  - TP53
  - KRAS
  - NRAS
  - BRAF
  - IDH1
  - IDH2
  - BAP1
  - ARID1A
  - ARID2
  - PBRM1
  - SMAD4
  - TGFBR2
  - ACVR2A
  - FGFR2
  - EPHA2
  - PIK3CA
  - PTEN
  - STK11
  - NF1
  - ATM
  - BRCA2
  - RNF43
  - ELF3
  - FBXW7
  - CDKN2A
  - RB1
  - KMT2C
  - KMT2D
  - SMARCA4
  - NCOR1
  - ERBB2
  - ERBB3
  - MET
  - CTNNB1
  - AXIN1
  - APC
  - TERT
  - MYC
  - KEAP1
  - NFE2L2
  - TSC1
  - TSC2
  - ROBO2
  - PTPN3
  - GNAS
  pathways:
    IDH:
    - IDH1
    - IDH2
    RAS_MAPK:
    - KRAS
    - NRAS
    - BRAF
    - NF1
    chromatin_remodeling:
    - ARID1A
    - ARID2
    - PBRM1
    - BAP1
    - KMT2C
    - KMT2D
    - SMARCA4
    SWI_SNF:
    - ARID1A
    - ARID2
    - PBRM1
    - SMARCA4
    TGFb:
    - SMAD4
    - TGFBR2
    - ACVR2A
    p53_cell_cycle:
    - TP53
    - RB1
    - CDKN2A
    - ATM
    PI3K_mTOR:
    - PIK3CA
    - PTEN
    - STK11
    - TSC1
    - TSC2
    WNT:
    - RNF43
    - CTNNB1
    - AXIN1
    - APC
  fusions: data/FU_iCCA/tables/mmc2_S1H_FGFR2_kinase_fusion.tsv
  fusion_genes:
  - FGFR2
  cna_gene: data/FU_iCCA/tables/mmc3_S2B_CNA_at_gene_level.tsv
  arm_threshold: 0.2
  arm_min_genes: 50
  exclude_arms:
  - 13p
  - 14p
  - 15p
  - 21p
  - 22p
  - Xp
  - Xq
  - Yp
  - Yq
  - 16p
  - 17p
  - 17q
  - 19p
  - 19q
  - 22q
  - 11q
  focal_amp_threshold: 0.9
  focal_del_threshold: -1.3
  focal:
    CDKN2A:
      type: hd
      genes:
      - CDKN2A
    PTEN:
      type: hd
      genes:
      - PTEN
    MDM2:
      type: amp
      genes:
      - MDM2
    CCND1_FGF19:
      type: amp
      genes:
      - CCND1
      - FGF19
    MYC:
      type: amp
      genes:
      - MYC
    ERBB2:
      type: amp
      genes:
      - ERBB2
    MET:
      type: amp
      genes:
      - MET
    KRAS:
      type: amp
      genes:
      - KRAS
    EGFR:
      type: amp
      genes:
      - EGFR
  OEP002768:
    sample_table: data/OEP002768/tables/samples_icca.tsv
miner:
  matrix: combat
  idmap: /users/sturkars/mambaforge/envs/miner3/lib/python3.11/site-packages/miner/data/identifier_mappings.txt
  tfs2genes: null
  min_genes: 6
  min_correlation: 0.2
  min_overexp_samples: 4
  max_exclusion: 0.5
  overexp_threshold: 80
  random_state: 12
  technical:
    anchor_module: null
    reference_cohort: FU_iCCA
    min_r_anchor: 0.7
    max_marker_r: 0.5
  exclude_modules: []
  exclude_min_fraction: 0.5
causal:
  alpha: 0.05
  q_max: 0.1
  min_cohort_altered: 5
  min_cohorts: 1
  family_r: 0.9
  min_abs_d: 0.5
  min_altered_hc: 25
  gene_positions: data/reference/gencode.v36.annotation.gtf.gene.probemap
  cytoband: data/reference/cytoBand_hg38.txt.gz
risk:
  subtypes_dir: subtypes_filtered
  survival_cohorts:
  - FU_iCCA
  - TCGA
  - GSE107943
  - OEP002768
  endpoints:
  - OS
  survival_suffix: _h36m
  q_max: 0.1
  method: xgboost
  n_estimators: 100
  iterations: 20
  class1_proportion: 0.2
  test_proportion: 0.35
  train_test:
  - train: FU_iCCA
    endpoint: OS
    test:
    - TCGA
    - GSE107943
    - OEP002768
  ridge:
    features:
    - programs
    - regulons
    train_cut_low: 0.5
    n_iter: 250
    max_alpha: 5000
    alpha_step: 100
    seed: 12
validation:
  horizon_days: 1096
  top_fraction: 0.2
  min_regulon_coverage: 0.5
  models:
  - FU_iCCA_OS_h36m
  split:
    seed: 12
  response:
    GSE255058:
      expression: data/GSE255058/suppl/GSE255058_Processed_Data_FPKM.xlsx
      id_column: Ensembl_gene_id
      responder_prefix: Responder
  cohorts:
    GSE244807:
      loader: tpm_geo
      expression: data/GSE244807/suppl/GSE244807_kallistoGeneAbund_geo.tsv.gz
      sample_table: data/GSE244807/samples_geo.tsv
      sample_id_column: ch:sample id
      survival:
        OS:
          time_column: ch:os
          event_column: ch:death
          time_to_days: 30.44
      strata_column: ch:tissue
      tech_covariate: true
      covariates:
        sex: ch:gender
        age: ch:age at_the_time_of_sampling
      endpoints:
      - OS
post:
  signatures_config: config/subtype_signatures.yaml
  subtypes_dir: subtypes_filtered
  min_set_genes: 5
  ntp:
    permutations: 1000
    fdr: 0.05
    seed: 1
    center: all
